[package]
name = "agnostos"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "agnostos"
test = false
required-features = ["uefi-bin"]

[features]
default = ["linked-list-allocator", "mouse"]
uefi-bin = []
linked-list-allocator = ["dep:linked_list_allocator"]
custom-allocator = []
mouse = []
# Emits IRQ-level input traces to QEMU's debug console.  This is deliberately
# opt-in so production builds do not expose a debug I/O port.
input-smoke = []
# Boots directly into an invalid-opcode exception so QEMU can verify the
# exception path without exposing fault triggers in normal builds.
fault-smoke = []
# Emits a single marker after several PIT IRQs so QEMU can verify timer
# delivery without exposing a test command in normal builds.
timer-smoke = []

[dependencies]
noto-sans-mono-bitmap = { version = "0.3", features = ["size_16", "size_20", "size_24", "size_32", "regular"] }
pc-keyboard = "0.9.0"
spin = "0.12.0"
uefi = "0.37.0"
x86_64 = { version = "0.15.5", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
linked_list_allocator = { version = "0.10.5", default-features = false, features = ["use_spin"], optional = true }
ringbuf = { version = "0.5.1", default-features = false }
static_cell = "2.1.1"

[profile.release]
panic = "abort"
