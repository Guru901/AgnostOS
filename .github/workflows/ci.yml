name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            rustup \
            qemu-desktop \
            edk2-ovmf \
            coreutils \
            base-devel

      - name: Setup Rust
        run: |
          rustup toolchain install nightly-2026-08-01 --profile minimal
          rustup target add x86_64-unknown-uefi --toolchain nightly-2026-08-01
          rustup component add rust-src --toolchain nightly-2026-08-01

      - name: Show Rust version
        run: |
          rustc +nightly-2026-08-01 --version --verbose
          cargo +nightly-2026-08-01 --version

      - name: Clean
        run: cargo +nightly-2026-08-01 clean

      - name: Build
        run: |
          cargo +nightly-2026-08-01 build \
            --release \
            --target x86_64-unknown-uefi \
            --features uefi-bin \
            -j4

      - name: Prepare EFI image
        run: |
          mkdir -p esp/EFI/BOOT
          cp target/x86_64-unknown-uefi/release/agnostos.efi \
             esp/EFI/BOOT/BOOTX64.EFI

      - name: Boot in QEMU
        run: |
          timeout 5s \
            qemu-system-x86_64 \
              -machine q35 \
              -nographic \
              -bios /usr/share/edk2/x64/OVMF.4m.fd \
              -drive format=raw,file=fat:rw:esp || test $? -eq 124
