name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            rustup \
            qemu-desktop \
            edk2-ovmf \
            coreutils \
            base-devel

      - name: Setup Rust
        run: |
          rustup toolchain install nightly-2026-08-01 --profile minimal
          rustup target add x86_64-unknown-uefi --toolchain nightly-2026-08-01
          rustup component add \
            clippy \
            rust-src \
            rustfmt \
            --toolchain nightly-2026-08-01

      - name: Show Rust version
        run: |
          rustc +nightly-2026-08-01 --version --verbose
          cargo +nightly-2026-08-01 --version

      - name: Clean
        run: cargo +nightly-2026-08-01 clean

      - name: Check formatting
        run: cargo +nightly-2026-08-01 fmt --all -- --check

      - name: Run host tests
        run: |
          TEST_WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_WORKDIR"' EXIT
          cd "$TEST_WORKDIR"
          cargo +nightly-2026-08-01 test \
            --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            --features mouse
          cargo +nightly-2026-08-01 test \
            --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            --no-default-features \
            --features custom-allocator,mouse

      - name: Run Clippy
        run: |
          CLIPPY_WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$CLIPPY_WORKDIR"' EXIT
          cd "$CLIPPY_WORKDIR"
          cargo +nightly-2026-08-01 clippy \
            --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            --features mouse \
            -- -D warnings
          cargo +nightly-2026-08-01 clippy \
            --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            --no-default-features \
            --features custom-allocator,mouse \
            -- -D warnings

      - name: Build
        run: |
          cargo +nightly-2026-08-01 build \
            --release \
            --target x86_64-unknown-uefi \
            --features uefi-bin \
            -j4

      - name: Prepare EFI image
        run: |
          mkdir -p esp/EFI/BOOT
          cp target/x86_64-unknown-uefi/release/agnostos.efi \
             esp/EFI/BOOT/BOOTX64.EFI

      - name: Boot in QEMU
        run: |
          timeout 5s \
            qemu-system-x86_64 \
              -machine q35 \
              -nographic \
              -bios /usr/share/edk2/x64/OVMF.4m.fd \
              -drive format=raw,file=fat:rw:esp || test $? -eq 124
