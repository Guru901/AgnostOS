steps:
  build:
    image: archlinux:latest
    commands:
      - pacman -Syu --noconfirm
      - pacman -S --noconfirm rustup qemu-desktop edk2-ovmf coreutils base-devel
      - rustup default stable
      - rustup target add x86_64-unknown-uefi

      - cargo build --release -j4

      - mkdir -p esp/EFI/BOOT
      - cp target/x86_64-unknown-uefi/release/agnostos.efi esp/EFI/BOOT/BOOTX64.EFI
      - timeout 5s qemu-system-x86_64 -machine q35 -nographic -bios /usr/share/edk2/x64/OVMF.4m.fd -drive format=raw,file=fat:rw:esp || test $? -eq 124
